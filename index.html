<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mahesh Vehicle Market</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f5f7;
    color:#222;
}

/* HEADER */
header{
    background:#111827;
    color:white;
    padding:18px 15px;
    text-align:center;
}

header h1{
    font-size:26px;
}

/* SEARCH */
.search-box{
    max-width:700px;
    margin:18px auto;
    padding:0 15px;
}

.search-box input{
    width:100%;
    padding:15px 18px;
    border:2px solid #ddd;
    border-radius:12px;
    font-size:17px;
    outline:none;
}

.search-box input:focus{
    border-color:#2563eb;
}

/* VEHICLE AREA */
.vehicle-container{
    max-width:1100px;
    margin:20px auto;
    padding:0 15px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

/* CARD */
.vehicle-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.vehicle-image{
    width:100%;
    height:220px;
    background:#e5e7eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:50px;
}

.vehicle-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.vehicle-info{
    padding:18px;
}

.vehicle-info h2{
    font-size:24px;
    margin-bottom:10px;
}

.price{
    color:#dc2626;
    font-size:23px;
    font-weight:bold;
    margin-bottom:15px;
}

.detail{
    margin:8px 0;
    font-size:16px;
}

.label{
    font-weight:bold;
    color:#374151;
}

.stock{
    display:inline-block;
    margin-top:10px;
    padding:8px 12px;
    background:#16a34a;
    color:white;
    border-radius:8px;
    font-weight:bold;
}

/* NO RESULT */
.no-result{
    text-align:center;
    font-size:20px;
    padding:40px;
    display:none;
}

/* MOBILE */
@media(max-width:600px){
    header h1{
        font-size:22px;
    }

    .vehicle-container{
        grid-template-columns:1fr;
    }

    .vehicle-image{
        height:230px;
    }

    .vehicle-info h2{
        font-size:22px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🚘 Mahesh Vehicle Market</h1>
</header>

<!-- SEARCH BAR -->
<div class="search-box">
    <input
        type="text"
        id="searchInput"
        placeholder="🔍 වාහනය / වර්ෂය / නගරය / Parts සොයන්න..."
        onkeyup="searchVehicles()"
    >
</div>

<!-- VEHICLE -->
<div class="vehicle-container" id="vehicleContainer">

    <div class="vehicle-card"
         data-search="BMW කාර් car bmw 2026 කොළඹ Colombo engine brake tyre body parts stock">

        <div class="vehicle-image">
            🚘
        </div>

        <div class="vehicle-info">

            <h2>BMW කාර්</h2>

            <div class="price">
                රු. 70,340,000
            </div>

            <div class="detail">
                <span class="label">වර්ෂය:</span>
                2026
            </div>

            <div class="detail">
                <span class="label">නගරය:</span>
                කොළඹ
            </div>

            <div class="detail">
                <span class="label">Parts වර්ග:</span>
                Engine, Brake, Tyre, Body Parts
            </div>

            <div class="detail">
                <span class="label">Stock:</span>
                1
            </div>

            <span class="stock">
                Stock Available
            </span>

        </div>
    </div>

</div>

<div class="no-result" id="noResult">
    ❌ වාහනය හමු නොවීය
</div>

<script>

function searchVehicles(){

    let input = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    let cards = document
        .querySelectorAll(".vehicle-card");

    let found = false;

    cards.forEach(function(card){

        let text = card
            .getAttribute("data-search")
            .toLowerCase();

        if(text.includes(input)){
            card.style.display = "block";
            found = true;
        }else{
            card.style.display = "none";
        }

    });

    document.getElementById("noResult").style.display =
        found ? "none" : "block";
}

</script>

</body>
</html>
