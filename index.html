<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mahesh Vehicle Market</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f4f7;
    color:#222;
}

header{
    background:#111827;
    color:white;
    padding:22px 15px;
    text-align:center;
}

header h1{
    font-size:28px;
    margin-bottom:8px;
}

header p{
    font-size:15px;
}

.search-box{
    padding:20px 15px;
    text-align:center;
    background:white;
}

.search-box input{
    width:95%;
    max-width:600px;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:15px;
    background:white;
}

.categories button{
    border:0;
    background:#e5e7eb;
    padding:10px 16px;
    border-radius:20px;
    white-space:nowrap;
    cursor:pointer;
}

.categories button:hover{
    background:#111827;
    color:white;
}

.vehicle-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
    padding:20px;
    max-width:1200px;
    margin:auto;
}

.vehicle-card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.vehicle-card img{
    width:100%;
    height:200px;
    object-fit:cover;
    display:block;
}

.vehicle-info{
    padding:16px;
}

.vehicle-info h2{
    font-size:21px;
    margin-bottom:10px;
}

.price{
    color:#d00000;
    font-size:20px;
    font-weight:bold;
    margin-bottom:12px;
}

.info{
    line-height:1.8;
    font-size:15px;
}

.details-btn{
    width:100%;
    margin-top:14px;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#111827;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.details-btn:hover{
    background:#374151;
}

footer{
    margin-top:20px;
    background:#111827;
    color:white;
    text-align:center;
    padding:20px;
}
</style>
</head>

<body>

<header>
    <h1>🚘 Mahesh Vehicle Market</h1>
    <p>ඔබට අවශ්‍ය වාහනය සොයන්න</p>
</header>

<div class="search-box">
    <input
        type="text"
        id="searchInput"
        placeholder="🔍 වාහනයක් සොයන්න..."
        onkeyup="searchVehicles()"
    >
</div>

<div class="categories">
    <button onclick="filterVehicles('all')">සියල්ල</button>
    <button onclick="filterVehicles('car')">🚗 කාර්</button>
    <button onclick="filterVehicles('jeep')">🚙 ජිප්</button>
    <button onclick="filterVehicles('van')">🚐 වෑන්</button>
    <button onclick="filterVehicles('bike')">🏍️ බයික්</button>
    <button onclick="filterVehicles('scooter')">🛵 ස්කූටර්</button>
    <button onclick="filterVehicles('bus')">🚌 බස්</button>
    <button onclick="filterVehicles('lorry')">🚚 ලොරි</button>
</div>

<div class="vehicle-grid" id="vehicleGrid">

    <!-- BMW -->
    <div class="vehicle-card" data-category="car">
        <img src="https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=900&q=80"
             alt="BMW කාර්">

        <div class="vehicle-info">
            <h2>BMW කාර්</h2>
            <div class="price">රු. 50,670,000</div>

                <b>ස්ටෝක්:</b> ඇත<br>
                <b>නගරය:</b> මහනුවර<br>
                <b>පා
